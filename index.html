<!DOCTYPE html>
<html>
  <head>
    <title>wax static</title>
    <style>
      body {
        margin: 2rem;
      }

      #gallery {
        list-style: none;
        padding: 0;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 1.5rem;
      }

      #gallery li a {
        display: block;
        text-decoration: none;
        color: inherit;
      }

      #gallery img {
        width: 100%;
        height: 140px;
        object-fit: cover;
        display: block;
      }



      #gallery span {
        display: block;
        margin-top: 0.4rem;
        font-size: 0.85rem;
        word-break: break-all;
      }
    </style>
  </head>
  
  <body>
    <h1>wax static</h1>
    <ul id="gallery"></ul>

    <script>
      fetch('/gallery.json')
        .then(r => r.json())
        .then(images => {
          const list = document.getElementById('gallery');
          images.forEach(src => {
            const li = document.createElement('li');
            const a = document.createElement('a');
            a.href = src;
            a.target = '_blank';

            const img = document.createElement('img');
            img.src = src;
            img.alt = src.slice(1);
            img.loading = 'lazy';

            const name = document.createElement('span');
            name.textContent = src.slice(1);

            a.appendChild(img);
            a.appendChild(name);
            li.appendChild(a);
            list.appendChild(li);
          });
        });
    </script>
  </body>
</html>
